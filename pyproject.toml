[project]
name = "rodents-vit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "albumentations>=2.0.8",
    "dotenv>=0.9.9",
    "ffmpeg-python>=0.2.0",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "numpy>=2.4.6",
    "opencv-python-headless>=4.13.0.92",
    "orjson>=3.11.9",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "pytest>=9.0.3",
    "pytorch-lightning>=2.6.4",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "segmentation-models-pytorch>=0.5.0",
    "tensorboard>=2.20.0",
    "timm>=1.0.27",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.14",
]

[tool.ruff]
target-version = "py314"
extend-exclude = ["generated"]

[tool.ruff.lint]
extend-select = ["I"]
